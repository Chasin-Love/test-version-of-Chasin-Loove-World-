name: Desktop Build (Linux + Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: '--bundles nsis'
            label: windows-nsis
          - os: ubuntu-latest
            targets: '--bundles deb appimage'
            label: linux-deb-appimage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux: Tauri v2 system dependencies (WebKitGTK etc.)
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      # The C++ core is compiled into the Tauri binary by build.rs (cc crate);
      # MSVC is preinstalled on windows-latest, GCC on ubuntu-latest.
      - name: Build desktop app (includes vite build + C++ core)
        run: npm run desktop:build -- ${{ matrix.targets }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-universe-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
