<!doctype html>
<html>
<head><meta charset="utf-8"><title>EFS black hole — shader lens test</title>
<style>body{margin:0;background:#04060c;color:#8ba1c4;font:11px monospace}canvas{image-rendering:auto;display:block}</style>
</head>
<body>
<div id="status">compiling…</div>
<canvas id="gl" width="420" height="260"></canvas>
<script>
/* Standalone verification rig for src/engine/blackhole.ts.
   Fetches the raw shader source from Vite (?raw) so the tested GLSL can
   never drift from the shipped shader, renders one frame with a fixed
   Interstellar-style camera, and exposes the frame as a PNG data URL. */
(async () => {
  const status = document.getElementById('status');
  const canvas = document.getElementById('gl');

  /* capture every console error — ANGLE shader compile failures show here */
  const logs = [];
  const origErr = console.error.bind(console);
  console.error = (...a) => { logs.push(a.map(String).join(' ').slice(0, 500)); origErr(...a); };
  window.addEventListener('error', (e) => logs.push('window: ' + e.message));
  window.__BH_LOGS = logs;

  /* ───────── ?mode=three — the REAL app path: three.js + the actual
     createBlackHole module, exactly as engine.ts builds it ───────── */
  if (location.search.includes('mode=three')) {
    const THREE = await import('/node_modules/three/build/three.module.js');
    const { createBlackHole } = await import('/src/engine/blackhole.ts');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
    renderer.setSize(canvas.width, canvas.height, false);
    const scene = new THREE.Scene();
    const q = new URLSearchParams(location.search);
    const dist = parseFloat(q.get('dist') ?? '13.8');
    const elev = (parseFloat(q.get('el') ?? '8.7') * Math.PI) / 180;
    const camera = new THREE.PerspectiveCamera(50, canvas.width / canvas.height, 0.1, 5000);
    camera.position.set(0, Math.sin(elev) * dist, Math.cos(elev) * dist);
    camera.lookAt(0, 0, 0);

    const bh = createBlackHole(2.6);
    scene.add(bh.group);
    bh.update(7.0, camera.quaternion);

    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    window.__BH_DATAURL = canvas.toDataURL('image/png');
    status.textContent = 'three mode done · logs: ' + (logs.length ? logs.join(' || ').slice(0, 300) : 'none');
    return;
  }

  const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });
  if (!gl) { status.textContent = 'no webgl'; return; }

  /* Vite's ?raw may answer with the module wrapper OR the plain file text —
     accept both so the rig always gets the true shader source */
  const rawMod = await (await fetch('/src/engine/blackhole.ts?raw')).text();
  let src;
  try { src = JSON.parse(rawMod.replace(/^export default/, '').trim().replace(/;$/, '')); }
  catch { src = rawMod; }
  let frag = src.match(/const FRAG = \/\* glsl \*\/ `([\s\S]*?)`;/)[1];
  /* ?debug=pipeline → paint every fragment red to isolate pipeline vs march */
  if (location.search.includes('debug=pipeline')) {
    frag = frag.replace('gl_FragColor = vec4(col, 1.0);', 'gl_FragColor = vec4(0.95, 0.15, 0.15, 1.0);');
  }
  if (location.search.includes('debug=ray')) {
    frag = frag.replace('gl_FragColor = vec4(col, 1.0);', 'gl_FragColor = vec4(normalize(vWorldPos - cameraPosition) * 0.5 + 0.5, 1.0);');
  }
  if (location.search.includes('debug=state')) {
    frag = frag.replace('gl_FragColor = vec4(col, 1.0);', 'gl_FragColor = vec4(vec3(float(captured), float(escaped), trans), 1.0);');
  }
  status.textContent = 'shader extracted · compiling…';

  const vert = `
    attribute vec3 position;
    varying vec2 vUv; varying vec3 vWorldPos;
    uniform vec3 uCam, uFwd, uRight, uUp;
    void main(){
      vUv = position.xy * 0.5 + 0.5;
      vWorldPos = uCam + uFwd * 2.0 + uRight * position.x * 2.2 + uUp * position.y * 1.45;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }`;

  const mk = (type, srcCode) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, srcCode);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, mk(gl.VERTEX_SHADER, vert));
  /* three injects `uniform vec3 cameraPosition;` — declare it here */
  gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, 'precision highp float;\nuniform vec3 cameraPosition;\n' + frag));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,0, 3,-1,0, -1,3,0]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'position');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);

  const set3 = (name, x, y, z) => gl.uniform3f(gl.getUniformLocation(prog, name), x, y, z);
  /* camera from URL: ?dist=<rs>&el=<degrees> — reproduce any view distance */
  const q = new URLSearchParams(location.search);
  const dist = parseFloat(q.get('dist') ?? '13.8');
  const elev = (parseFloat(q.get('el') ?? '8.7') * Math.PI) / 180;
  const camPos = [0, Math.sin(elev) * dist, Math.cos(elev) * dist];
  set3('cameraPosition', ...camPos);
  set3('uCam', ...camPos);                          /* test vertex shader uses uCam for vWorldPos */
  set3('uCenter', 0, 0, 0);
  set3('uNormal', 0.055, 1.0, 0.04);
  set3('uDiskX', 0.9988, -0.0548, 0);
  set3('uDiskZ', -0.0022, -0.04, 0.9992);
  gl.uniform1f(gl.getUniformLocation(prog, 'uRs'), 1.0);
  gl.uniform1f(gl.getUniformLocation(prog, 'uTime'), 7.0);
  gl.uniform1f(gl.getUniformLocation(prog, 'uDiskIn'), 3.0);
  gl.uniform1f(gl.getUniformLocation(prog, 'uDiskOut'), 12.0);
  gl.uniform1f(gl.getUniformLocation(prog, 'uBright'), 4.2);
  gl.uniform1f(gl.getUniformLocation(prog, 'uDoppler'), 0.8);

  const fwd = (() => { const c = [0, 2.1, 13.8]; const l = Math.hypot(...c); return [-c[0]/l, -c[1]/l, -c[2]/l]; })();
  const right = (() => { const r = [fwd[2], 0, -fwd[0]]; const l = Math.hypot(...r) || 1; return [r[0]/l, r[1]/l, r[2]/l]; })();
  const up = [ right[1]*fwd[2]-right[2]*fwd[1], right[2]*fwd[0]-right[0]*fwd[2], right[0]*fwd[1]-right[1]*fwd[0] ];
  set3('uFwd', ...fwd); set3('uRight', ...right); set3('uUp', ...up);

  status.textContent = 'marching geodesics…';
  await new Promise(r => setTimeout(r, 30));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  window.__BH_DEBUG = {
    cam: gl.getUniform(prog, gl.getUniformLocation(prog, 'cameraPosition')),
    uCam: gl.getUniform(prog, gl.getUniformLocation(prog, 'uCam')),
    uCenter: gl.getUniform(prog, gl.getUniformLocation(prog, 'uCenter')),
    uRs: gl.getUniform(prog, gl.getUniformLocation(prog, 'uRs')),
  };

  /* flip Y into a 2D canvas and export */
  const px = new Uint8Array(canvas.width * canvas.height * 4);
  gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const ctx = out.getContext('2d');
  const img = ctx.createImageData(out.width, out.height);
  for (let y = 0; y < out.height; y++) {
    img.data.set(px.subarray((out.height - 1 - y) * out.width * 4, (out.height - y) * out.width * 4), y * out.width * 4);
  }
  ctx.putImageData(img, 0, 0);
  document.body.appendChild(out);
  window.__BH_DATAURL = out.toDataURL('image/png');
  status.textContent = 'done — ' + canvas.width + '×' + canvas.height + ' · dataURL ready';
})().catch((e) => { document.getElementById('status').textContent = 'FAIL: ' + e.message; });
</script>
</body>
</html>
