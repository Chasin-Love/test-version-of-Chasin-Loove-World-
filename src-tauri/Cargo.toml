[package]
name = "my-universe"
version = "2.0.0"
description = "MY UNIVERSE — a living 3D cosmos, diary and vault (desktop shell)"
authors = ["Chasin-Love"]
edition = "2021"

[lib]
name = "my_universe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles src/native/cosmos_engine.cpp directly into the binary — the C++
# core ships inside the app with no DLL loading step at all.
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
